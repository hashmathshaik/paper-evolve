<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 230" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">How a contribution reaches the map</title>
<desc id="d">Five steps: pick a pair of papers, your agent reads both, quotes are checked, a pull request is reviewed, and the connection appears on the map.</desc>
<style>@keyframes s0{0%,0%{stroke:#d9e2da;fill:#fff}6%,18%{stroke:#28756e;fill:#eef5ee}26%,100%{stroke:#d9e2da;fill:#fff}}.s0{animation:s0 10s ease-in-out infinite}@keyframes s1{0%,16%{stroke:#d9e2da;fill:#fff}22%,34%{stroke:#28756e;fill:#eef5ee}42%,100%{stroke:#d9e2da;fill:#fff}}.s1{animation:s1 10s ease-in-out infinite}@keyframes s2{0%,32%{stroke:#d9e2da;fill:#fff}38%,50%{stroke:#28756e;fill:#eef5ee}58%,100%{stroke:#d9e2da;fill:#fff}}.s2{animation:s2 10s ease-in-out infinite}@keyframes s3{0%,48%{stroke:#d9e2da;fill:#fff}54%,66%{stroke:#28756e;fill:#eef5ee}74%,100%{stroke:#d9e2da;fill:#fff}}.s3{animation:s3 10s ease-in-out infinite}@keyframes s4{0%,64%{stroke:#d9e2da;fill:#fff}70%,82%{stroke:#28756e;fill:#eef5ee}90%,100%{stroke:#d9e2da;fill:#fff}}.s4{animation:s4 10s ease-in-out infinite}@keyframes dot{0%{transform:translateX(0);opacity:0}6%{opacity:1}86%{opacity:1}94%,100%{transform:translateX(992px);opacity:0}}.dot{animation:dot 10s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot{opacity:0}}</style>
<rect x=".5" y=".5" width="1239" height="229" rx="16" fill="#fafbf9" stroke="#e0e6e1"/>
<path d="M234 115h26" stroke="#b9c6ba" stroke-width="1.6" fill="none"/><path d="M256 110l6 5-6 5" stroke="#b9c6ba" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s0" x="20" y="48" width="208" height="134" rx="12" fill="#fff" stroke="#d9e2da" stroke-width="1.4"/><circle cx="46" cy="76" r="12" fill="#28756e"/><text x="46" y="80.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">1</text><text x="36" y="114" font-size="16" font-weight="500" fill="#263c38">Pick a pair</text><text x="36" y="138" font-size="12.5" fill="#70807b">A prepared task, or any</text><text x="36" y="156" font-size="12.5" fill="#70807b">two papers you choose</text>
<path d="M482 115h26" stroke="#b9c6ba" stroke-width="1.6" fill="none"/><path d="M504 110l6 5-6 5" stroke="#b9c6ba" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s1" x="268" y="48" width="208" height="134" rx="12" fill="#fff" stroke="#d9e2da" stroke-width="1.4"/><circle cx="294" cy="76" r="12" fill="#28756e"/><text x="294" y="80.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">2</text><text x="284" y="114" font-size="16" font-weight="500" fill="#263c38">Your agent reads both</text><text x="284" y="138" font-size="12.5" fill="#70807b">Claude Code, Codex</text><text x="284" y="156" font-size="12.5" fill="#70807b">or your own API key</text>
<path d="M730 115h26" stroke="#b9c6ba" stroke-width="1.6" fill="none"/><path d="M752 110l6 5-6 5" stroke="#b9c6ba" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s2" x="516" y="48" width="208" height="134" rx="12" fill="#fff" stroke="#d9e2da" stroke-width="1.4"/><circle cx="542" cy="76" r="12" fill="#28756e"/><text x="542" y="80.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">3</text><text x="532" y="114" font-size="16" font-weight="500" fill="#263c38">Quotes are checked</text><text x="532" y="138" font-size="12.5" fill="#70807b">Every quote must match</text><text x="532" y="156" font-size="12.5" fill="#70807b">the paper it cites</text>
<path d="M978 115h26" stroke="#b9c6ba" stroke-width="1.6" fill="none"/><path d="M1000 110l6 5-6 5" stroke="#b9c6ba" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s3" x="764" y="48" width="208" height="134" rx="12" fill="#fff" stroke="#d9e2da" stroke-width="1.4"/><circle cx="790" cy="76" r="12" fill="#28756e"/><text x="790" y="80.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">4</text><text x="780" y="114" font-size="16" font-weight="500" fill="#263c38">Pull request</text><text x="780" y="138" font-size="12.5" fill="#70807b">A maintainer reads the</text><text x="780" y="156" font-size="12.5" fill="#70807b">sources and accepts</text>
<rect class="s4" x="1012" y="48" width="208" height="134" rx="12" fill="#fff" stroke="#d9e2da" stroke-width="1.4"/><circle cx="1038" cy="76" r="12" fill="#28756e"/><text x="1038" y="80.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">5</text><text x="1028" y="114" font-size="16" font-weight="500" fill="#263c38">On the map</text><text x="1028" y="138" font-size="12.5" fill="#70807b">The connection goes live</text><text x="1028" y="156" font-size="12.5" fill="#70807b">with your name on it</text>
</svg>
