<title id="t">The five kinds of connection</title>
<desc id="d">Extends keeps an idea and adds capabilities or scope. Challenges questions a claim, assumption or limitation. Combines joins ideas from separate lines of work. Transfers takes an idea to a new task or field. Revives brings an older idea back under new conditions.</desc>
